<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ogulgerek 🌹</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
}

/* TAM EKRAN 3D SAHNE */
#scene-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
}

/* ÜST UI */
#ui {
    position: fixed;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
}

#message {
    color: white;
    font-size: 32px;
    font-weight: bold;
    text-shadow: 0px 0px 20px pink;
    margin-bottom: 20px;
}

/* BUTONLAR */
.buttons {
    pointer-events: auto;
}

button {
    font-size: 20px;
    padding: 12px 30px;
    margin: 10px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
    font-weight: 600;
}

#yes {
    background: #ff4d79;
    color: white;
}

#no {
    background: #444;
    color: white;
}

button:hover {
    transform: scale(1.1);
}

/* CEVAP ALANI */
#response {
    margin-top: 20px;
    font-size: 22px;
    color: white;
    max-width: 700px;
    text-shadow: 0px 0px 10px pink;
}
</style>
</head>

<body>

<audio id="bg-music" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_6d2b6a0c71.mp3?filename=romantic-piano-11248.mp3" type="audio/mpeg">
</audio>

<div id="scene-container"></div>

<div id="ui">
    <div id="message">Ogulgerek, benimle tanışmak ister misin? 🌹</div>

    <div class="buttons">
        <button id="yes" onclick="answer('yes')">EVET 💖</button>
        <button id="no" onclick="answer('no')">HAYIR 😅</button>
    </div>

    <div id="response"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152/build/three.min.js"></script>

<script>
// ====== GERÇEK TAM EKRAN + MÜZİK ======
document.body.addEventListener("click", () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    }
    document.getElementById("bg-music").play();
});

// ====== SAHNE ======
const container = document.getElementById("scene-container");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050013);
scene.fog = new THREE.Fog(0x050013, 5, 20);

// KAMERA
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 6;

// RENDERER
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);

// IŞIKLAR
const light1 = new THREE.PointLight(0xff66cc, 2.5, 60);
light1.position.set(3, 3, 3);
scene.add(light1);

const ambient = new THREE.AmbientLight(0x222222);
scene.add(ambient);

// ====== 3D GÜL (ANA GÜL) ======
const roseGroup = new THREE.Group();
const centerGeo = new THREE.SphereGeometry(0.4, 32, 32);
const centerMat = new THREE.MeshStandardMaterial({
    color: 0xff0044,
    metalness: 0.6,
    roughness: 0.2,
    emissive: 0x330011
});
const center = new THREE.Mesh(centerGeo, centerMat);
roseGroup.add(center);

for (let i = 0; i < 10; i++) {
    const petalGeo = new THREE.SphereGeometry(0.25, 16, 16);
    const petalMat = new THREE.MeshStandardMaterial({
        color: 0xff2255,
        metalness: 0.5,
        roughness: 0.3
    });

    const petal = new THREE.Mesh(petalGeo, petalMat);
    const angle = (i / 10) * Math.PI * 2;
    petal.position.x = Math.cos(angle) * 0.6;
    petal.position.y = Math.sin(angle) * 0.3;
    roseGroup.add(petal);
}
scene.add(roseGroup);

// ====== UÇUŞAN YAPRAKLAR ======
const petalGeom = new THREE.BufferGeometry();
const petalCount = 1500;
const petalPos = new Float32Array(petalCount * 3);

for (let i = 0; i < petalCount * 3; i++) {
    petalPos[i] = (Math.random() - 0.5) * 20;
}

petalGeom.setAttribute("position", new THREE.BufferAttribute(petalPos, 3));

const petals = new THREE.Points(
    petalGeom,
    new THREE.PointsMaterial({ size: 0.06, color: 0xff6699 })
);
scene.add(petals);

// ====== YENİ GÜL EKLEME (Her EVET'te) ======
function addRose() {
    const newRose = roseGroup.clone();
    newRose.position.x = (Math.random() - 0.5) * 4;
    newRose.position.y = (Math.random() - 0.5) * 3;
    newRose.position.z = -2;
    scene.add(newRose);
}

// ====== ARKA PLAN DEĞİŞTİRME ======
function changeBackground(choice) {
    if (choice === "yes") {
        scene.background = new THREE.Color(0x200020); // daha pembe
    } else {
        scene.background = new THREE.Color(0x050013); // daha koyu
    }
}

// ====== FİNAL ANİMASYONU ======
function finalAnimation() {
    for (let i = 0; i < 10; i++) addRose();
    scene.background = new THREE.Color(0x330033);
}

// ====== ANİMASYON ======
let time = 0;
function animate() {
    requestAnimationFrame(animate);
    time += 0.01;
    roseGroup.rotation.y += 0.01;
    petals.rotation.y += 0.001;
    renderer.render(scene, camera);
}
animate();

// ====== AI İÇİN HAZIR ======
let conversationHistory = [
  "Soru: Ogulgerek, benimle tanışmak ister misin?"
];

async function answer(choice) {
    changeBackground(choice);

    if (choice === "yes") addRose();

    document.getElementById("response").innerHTML =
      "Ogulgerek düşünüyor... 🌹";

    const res = await fetch("https://SENIN-SUNUCUN/ask-ai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            history: conversationHistory,
            lastAnswer: choice
        })
    });

    const data = await res.json();
    const aiText = data.message;

    if (aiText.includes("IKNA_OLDU")) {
        document.getElementById("message").innerHTML =
          "✨ Ogulgerek, teşekkür ederim! 🌹";
        document.getElementById("response").innerHTML =
          aiText.replace("IKNA_OLDU", "");
        finalAnimation();
        return;
    }

    document.getElementById("message").innerHTML = aiText;
    conversationHistory.push(`AI: ${aiText}`);
}
</script>
</body>
</html>
